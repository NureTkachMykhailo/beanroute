{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<div class="container" style="padding-top:40px; max-width:460px;">
  <div class="cabinet-card">
    <h1 class="section-title">Реєстрація</h1>
    <form method="post" class="form-row">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit" style="margin-top:10px;">Зареєструватися</button>
    </form>
  </div>
</div>
{% endblock %}
